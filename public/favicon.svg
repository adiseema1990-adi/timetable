<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="calendar-clip">
      <rect x="240" y="245" width="255" height="250" rx="38" ry="38" />
    </clipPath>
  </defs>

  <!-- Ground / Base of school -->
  <rect x="16" y="396" width="480" height="34" rx="17" fill="#ff9f1a" stroke="#000000" stroke-width="16" stroke-linejoin="round" />

  <!-- Flagpole -->
  <path d="M 215 120 L 215 15" stroke="#000000" stroke-width="16" stroke-linecap="round" />
  
  <!-- Flag -->
  <path d="M 223 24 L 285 24 Q 268 45 288 66 L 223 66 Z" fill="#eb3b5a" stroke="#000000" stroke-width="14" stroke-linejoin="round" />
  <!-- Flag shadow highlight -->
  <path d="M 235 28 L 272 28 Q 260 45 275 62 L 250 62 Q 235 48 245 35 Z" fill="#fc5c65" opacity="0.6" />

  <!-- School Main Body (Walls) -->
  <rect x="40" y="180" width="370" height="225" fill="#fedaa4" stroke="#000000" stroke-width="16" stroke-linejoin="round" />

  <!-- Windows on Left Wall -->
  <rect x="68" y="235" width="56" height="48" rx="8" fill="#00d2d3" stroke="#000000" stroke-width="14" stroke-linejoin="round" />
  <rect x="68" y="310" width="56" height="48" rx="8" fill="#00d2d3" stroke="#000000" stroke-width="14" stroke-linejoin="round" />

  <!-- Main School Roof Structure -->
  <!-- Left roof eaves -->
  <path d="M 18 185 L 215 105 L 412 185 L 380 205 L 215 135 L 50 205 Z" fill="#ff9f1a" stroke="#000000" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Front Gable Triangle -->
  <polygon points="215,108 85,215 345,215" fill="#ffecb3" stroke="#000000" stroke-width="16" stroke-linejoin="round" />
  <polygon points="215,108 50,185 380,185" fill="#ff9f1a" opacity="0.15" />

  <!-- School Entrance (Arch/Door) -->
  <path d="M 160 400 L 160 300 C 160 270 270 270 270 300 L 270 400 Z" fill="#ffecb3" stroke="#000000" stroke-width="16" stroke-linejoin="round" />
  <!-- Door Cyan Panels -->
  <path d="M 172 400 L 172 315 C 172 292 258 292 258 315 L 258 400 Z" fill="#00a8ff" stroke="#000000" stroke-width="12" stroke-linejoin="round" />
  <!-- Door split -->
  <line x1="215" y1="312" x2="215" y2="400" stroke="#000000" stroke-width="12" stroke-linecap="round" />
  <!-- Door transom divider -->
  <line x1="172" y1="300" x2="258" y2="300" stroke="#000000" stroke-width="10" />

  <!-- Clock on Front Gable -->
  <circle cx="215" cy="190" r="42" fill="#ffffff" stroke="#000000" stroke-width="16" />
  <!-- Clock Hands -->
  <path d="M 215 190 L 215 168" stroke="#000000" stroke-width="12" stroke-linecap="round" />
  <path d="M 215 190 L 228 198" stroke="#000000" stroke-width="12" stroke-linecap="round" />
  <circle cx="215" cy="190" r="4" fill="#000000" />

  <!-- CALENDAR in Foreground (Right) -->
  <!-- Calendar Base Card -->
  <rect x="240" y="245" width="255" height="250" rx="38" ry="38" fill="#ffffff" stroke="#000000" stroke-width="18" stroke-linejoin="round" />

  <!-- Calendar Red Header (Clipped to top of calendar card) -->
  <g clip-path="url(#calendar-clip)">
    <rect x="235" y="240" width="265" height="75" fill="#eb3b5a" stroke="#000000" stroke-width="16" />
    <line x1="235" y1="315" x2="505" y2="315" stroke="#000000" stroke-width="16" />
  </g>

  <!-- Calendar Yellow Binder Rings / Hooks -->
  <rect x="290" y="222" width="36" height="60" rx="18" fill="#fed330" stroke="#000000" stroke-width="16" />
  <rect x="408" y="222" width="36" height="60" rx="18" fill="#fed330" stroke="#000000" stroke-width="16" />

  <!-- Calendar Date Squares (3 x 2 grid) -->
  <!-- Row 1 -->
  <rect x="275" y="345" width="44" height="44" rx="12" fill="#eb3b5a" stroke="#000000" stroke-width="14" stroke-linejoin="round" />
  <rect x="345" y="345" width="44" height="44" rx="12" fill="#eb3b5a" stroke="#000000" stroke-width="14" stroke-linejoin="round" />
  <rect x="415" y="345" width="44" height="44" rx="12" fill="#eb3b5a" stroke="#000000" stroke-width="14" stroke-linejoin="round" />

  <!-- Row 2 -->
  <rect x="275" y="415" width="44" height="44" rx="12" fill="#eb3b5a" stroke="#000000" stroke-width="14" stroke-linejoin="round" />
  <rect x="345" y="415" width="44" height="44" rx="12" fill="#eb3b5a" stroke="#000000" stroke-width="14" stroke-linejoin="round" />
  <rect x="415" y="415" width="44" height="44" rx="12" fill="#eb3b5a" stroke="#000000" stroke-width="14" stroke-linejoin="round" />
</svg>
